<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mecha Turk</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }

            /*
             * Layout contract (005 FR-082; product-owner review 2026-09-30).
             *
             * `#root` is a column flex container, and by default every child
             * of one shrinks as content pushes back — which is exactly how a
             * tall tab body squeezed the six-tab strip between the banner
             * block and the content until the tabs stopped being clickable.
             * So: no child of `#root` may give up height except the body
             * region the shell marks (`src/tabs.ts` sets `flex: 1 1 auto`,
             * `min-height: 0`, and `overflow-y: auto` inline, which wins over
             * this rule). The strip, the banners, and the notice keep their
             * natural height; the region below them is the scroller.
             */
            #root > * {
                flex-shrink: 0;
            }

            #root {
                /*
                 * Design tokens (2026-09-30 visual redesign; field-manual
                 * treatment 2026-10-06).
                 *
                 * Every value is an alias of a token the host theme paints
                 * onto `<html>` through `applyHostTheme` (the SDK writes both
                 * its `--oc-*` aliases and the host's own `--surface-*` /
                 * `--interactive-*` names), so light and dark follow the host
                 * without this file knowing either palette. The right-hand
                 * fallbacks only ever run in a frame the host never readied,
                 * and each one is chosen to stay legible in both modes.
                 *
                 * `--mt-dim`'s fallback is the one that had to change when the
                 * three host fixtures were measured (005 NFR-107): `gray` is
                 * 3.95:1 on a white canvas, so every muted role in an
                 * alias-unavailable frame failed the 4.5:1 normal-text floor.
                 * `#767676` is measured, not guessed: 4.54:1 on white and
                 * 4.62:1 on black, which is what a fallback must clear in
                 * *either* mode — no darker neutral clears 4.5:1 on both. It
                 * is a last resort, never shown beside a host that has readied.
                 */
                --mt-gap: 12px;
                --mt-pad: 14px;
                --mt-space-1: 4px;
                --mt-space-2: 8px;
                --mt-space-3: 12px;
                --mt-space-4: 16px;
                --mt-radius: var(--radius, 8px);
                --mt-surface: var(--oc-elevated, var(--surface-elevated, transparent));
                --mt-sunken: var(--oc-subtle, var(--surface-subtle, transparent));
                --mt-ink: var(--oc-fg, var(--surface-foreground, inherit));
                --mt-dim: var(--oc-muted, var(--surface-muted-foreground, #767676));
                --mt-line: var(--oc-border, var(--interactive-border, currentColor));
                --mt-accent: var(--oc-primary, var(--primary, currentColor));
                --mt-font: var(--oc-font, var(--font-sans, inherit));
                --mt-mono: var(--oc-mono, var(--font-mono, monospace));
                --mt-hover: var(--oc-hover, var(--interactive-hover, transparent));
                --mt-key-width: 13rem;
                /* Two shares of `--mt-line`, for the static decoration at the
                 * end of this sheet: a rule you can read and a hairline you
                 * read past. Both are derived from the host's own border token
                 * rather than from a colour of their own. */
                --mt-hairline: color-mix(in srgb, var(--mt-line) 55%, transparent);
                --mt-faint: color-mix(in srgb, var(--mt-line) 26%, transparent);

                height: 100%;
                padding: 12px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 12px;
                overflow-y: auto;
                font-family: var(--mt-font);
                font-size: 0.875rem;
                line-height: 1.45;
                color: var(--mt-ink);
            }

            #panel-startup-notice {
                position: fixed;
                inset: 0;
                z-index: 1000;
                box-sizing: border-box;
                margin: 0;
                padding: 14px;
                overflow: auto;
                color: var(--oc-fg, var(--surface-foreground, CanvasText));
                background: var(--oc-elevated, var(--surface-elevated, Canvas));
                font-family: var(--oc-font, var(--font-sans, system-ui, sans-serif));
                font-size: 0.875rem;
                line-height: 1.45;
            }

            /* ---------------------------------------------------------------- *
             * Hidden: the element is out of the layout, whatever says otherwise.
             * ---------------------------------------------------------------- */

            /*
             * The HTML standard's suggested rendering for `hidden` is
             * `display: none`, and its own note warns that "because this
             * attribute is typically implemented using CSS, it's also
             * possible to override it using CSS" — an author rule naming a
             * hidden element outranks the UA sheet outright. The panel writes
             * such rules everywhere, so the suggested rendering is strengthened
             * with `!important`: the form GitHub's Primer CSS ships, and the
             * only form that settles the contest in one place.
             *
             * Three shapes painted while hidden before this rule existed:
             *
             *   `section.mt-block`   → `flex`       `createBlock` hands back
             *                                       the section itself when a
             *                                       block carries no lede, so
             *                                       `.mt-block` names it.
             *   `button.oc-sdk-btn`  → `inline-flex` the SDK's own sheet.
             *   three plain Dispatches → `flex`      an inline `style.display`
             *   control rows                           from `src/`.
             *
             * `!important` is the point, not decoration: importance is compared
             * before specificity, before source order, and before the style
             * attribute, so no *normal* author declaration — from this sheet,
             * from the SDK's, or written inline — can reach an element the
             * panel marked hidden.
             *
             * Two fences check it: `tools/visual/assert-body.js` refuses a
             * capture whose live document still paints a `[hidden]` element,
             * and `tests/visual-structure.test.ts` proves the cascade offline
             * (including that the answers flip when this rule is stripped).
             */
            [hidden] {
                display: none !important;
            }

            /* ---------------------------------------------------------------- *
             * Shell: the six tab bodies are stacks of blocks.
             * ---------------------------------------------------------------- */

            [data-body] {
                display: flex;
                flex-direction: column;
                gap: var(--mt-gap);
            }

            /*
             * Exactly one body is in the layout; the other five are out of it.
             *
             * `src/tabs.ts` paints the shell by writing the `hidden` attribute
             * onto the five bodies that are not active — but the UA sheet's
             * `[hidden] { display: none }` is origin-weak, so the author rule
             * above (0,1,0) beats it outright and every body stayed `flex`.
             * The region's `scrollHeight` then summed all six, a tab click
             * moved only the pill, and `npm run shot` photographed a scroll
             * position rather than a selection.
             *
             * Two attribute selectors score (0,2,0): they outrank the rule
             * above whatever the order, they outrank the UA sheet on origin
             * alone, and they cannot match anything but a body the shell has
             * actually marked hidden.
             *
             * The `[hidden]` rule above now takes a body out of the layout as
             * well, so the two agree rather than compete; this one stays
             * because it states the tab-body contract where it is read, and
             * the offline fence strips both to show the stylesheet as it was
             * before either rule hid a body.
             */
            [data-body][hidden] {
                display: none;
            }

            /* ---------------------------------------------------------------- *
             * Blocks: every logical group gets a heading and its own surface.
             * ---------------------------------------------------------------- */

            .mt-block {
                display: flex;
                flex-direction: column;
                gap: var(--mt-space-2);
                padding: var(--mt-pad);
                box-sizing: border-box;
                border: 1px solid color-mix(in srgb, var(--mt-line) 60%, transparent);
                border-radius: var(--mt-radius);
                background: var(--mt-surface);
            }

            .mt-block--sunken {
                background: var(--mt-sunken);
            }

            .mt-block--flush {
                gap: var(--mt-space-1);
                padding: var(--mt-space-2) var(--mt-pad) var(--mt-pad);
            }

            /*
             * A control a tab mounts straight into a block is a flex item of a
             * column whose default `align-items` is `stretch`, so it paints as
             * a slab the full width of the pane — and a *disabled* one, with
             * nothing but its label to show, reads as an empty text input.
             * Seven of them stacked in the Bindings editor is exactly how that
             * looked (product-owner review 2026-10-01).
             *
             * The second selector reaches the body `createBlock` builds when a
             * block carries a lede: the block's own children stop at the
             * `.mt-group` wrapper, so a rule naming only the block would miss
             * every button behind one. A run of controls that wants to share a
             * line already sits in `.mt-toolbar`, which this never matches.
             */
            .mt-block > .oc-sdk-btn,
            .mt-block > .mt-group > .oc-sdk-btn {
                align-self: flex-start;
            }

            .mt-heading {
                margin: 0;
                font-family: var(--mt-font);
                font-size: 0.6875rem;
                font-weight: 700;
                line-height: 1.4;
                letter-spacing: 0.07em;
                text-transform: none;
                color: var(--mt-dim);
            }

            .mt-heading--title {
                font-size: 0.9375rem;
                font-weight: 650;
                letter-spacing: 0;
                color: var(--mt-ink);
            }

            .mt-lede {
                margin: 0;
                font-size: 0.8125rem;
                line-height: 1.5;
                color: var(--mt-dim);
                /* Prose keeps a measure on a rail: a 110-character line is
                   a desktop line, and the eye has to travel back across the
                   whole panel to find the next one. */
                max-width: 74ch;
            }

            /* A controls row: filters, paging, and the read-state line. */
            .mt-toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--mt-space-2);
            }

            .mt-toolbar--split {
                justify-content: space-between;
            }

            /*
             * A toolbar that mixes bare buttons with label-over-control
             * selects. Centering floats a 36px button in the middle of a
             * ~50px select stack, so "Clear filters" hangs off no line at
             * all; bottom-aligning puts every control on one edge (the
             * Dispatches paging and filter row, 2026-10-01 review). The
             * button-and-a-line toolbars on Status and About keep `center`,
             * where a caption beside a button should sit mid-height.
             */
            .mt-toolbar--controls {
                align-items: flex-end;
            }

            .mt-stack {
                display: flex;
                flex-direction: column;
                gap: var(--mt-space-2);
            }

            .mt-group {
                display: flex;
                flex-direction: column;
                gap: var(--mt-space-3);
            }

            /* ---------------------------------------------------------------- *
             * Definition rows: label and value as structure, not prose.
             * ---------------------------------------------------------------- */

            .mt-defs {
                display: flex;
                flex-direction: column;
            }

            /*
             * Definition rows stack by default: the label sits above its
             * value, which is how a right-hand rail is read. The key *column*
             * is an enhancement rather than the starting point — block 2 adds
             * one from 640px up, and below that line the row keeps stacking,
             * because the host's own default panel measures 500–715px (the
             * width evidence lives with `DEFAULT_WIDTH` in `tools/visual/
             * shot.js`).
             */
            .mt-def {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                row-gap: 2px;
                padding: var(--mt-space-2) 0;
                border-top: 1px solid color-mix(in srgb, var(--mt-line) 45%, transparent);
            }

            .mt-def:first-child {
                padding-top: 0;
                border-top: 0;
            }

            .mt-def:last-child {
                padding-bottom: 0;
            }

            .mt-def--note {
                grid-template-columns: minmax(0, 1fr);
            }

            .mt-def--interactive {
                border-radius: 6px;
                margin: 0 calc(-1 * var(--mt-space-1));
                padding-left: var(--mt-space-1);
                padding-right: var(--mt-space-1);
            }

            .mt-def--interactive:hover {
                background: var(--mt-hover);
            }

            .mt-key {
                min-width: 0;
                color: var(--mt-dim);
            }

            .mt-key--strong {
                color: var(--mt-ink);
                font-weight: 600;
            }

            .mt-key--mono {
                font-family: var(--mt-mono);
                font-size: 0.75rem;
            }

            /*
             * The stacked row's label (the default): a small tracked line
             * over its value — the shape a form field has, which is what a
             * definition row becomes on a rail. `.mt-def .mt-key`
             * out-specifies the `--strong`/`--mono` modifiers for size and
             * weight, exactly as the old 560px query did, but never touches
             * colour: `--strong` still darkens its key and `--mono` still
             * brings the family. Block 2 restores the columnar type at 640px.
             */
            .mt-def .mt-key {
                font-size: 0.6875rem;
                line-height: 1.4;
                font-weight: 700;
                letter-spacing: 0.05em;
            }

            .mt-val {
                min-width: 0;
                font-size: 0.8125rem;
                line-height: 1.45;
                color: var(--mt-ink);
                font-variant-numeric: tabular-nums;
                overflow-wrap: anywhere;
            }

            .mt-val--mono {
                font-family: var(--mt-mono);
                font-size: 0.75rem;
            }

            .mt-val--dim {
                color: var(--mt-dim);
            }

            /*
             * Cells own their text treatment.
             *
             * `mountText` renders into a node carrying the SDK's own `.oc-sdk`
             * class, which sets the family, size, colour, and line-height of
             * the *inner* node — so a treatment set on the wrapper would lose
             * every cascade argument. These rules hand the inner node back to
             * its cell; the SDK's link and image rules still apply inside it.
             */
            .mt-key .oc-sdk-text,
            .mt-val .oc-sdk-text,
            .mt-lede .oc-sdk-text,
            .mt-prose .oc-sdk-text,
            .mt-fix .oc-sdk-text,
            .mt-card-body .oc-sdk-text,
            .mt-heading .oc-sdk-text {
                font: inherit;
                color: inherit;
            }

            /* ---------------------------------------------------------------- *
             * Settings: field, value, and shape as one row per declared member.
             * ---------------------------------------------------------------- */

            /*
             * Settings is one column on a rail — label, control, bounds, in
             * that order, stacked — and it keeps no header over a stack it
             * cannot line up. The three-column table and its header are a
             * wide-viewport enhancement (block 2, at 900px), never a shape
             * the layout has to fall *out* of when the panel is narrow.
             *
             * The rule that hides the header is declared after `.mt-head`
             * (below), where source order can settle the cascade — see the
             * note there for why its position is the whole fix.
             */

            .mt-grid {
                display: flex;
                flex-direction: column;
            }

            /*
             * Each SDK field lays its label, control, and note out as the
             * three columns the header names — the wrapper is a flex column
             * precisely so the header and the rows are siblings that only have
             * to agree on the template, never on their children's index.
             *
             * By default there is one column: a rail stacks, and the header
             * above it is hidden (block 2 brings both back at 900px).
             */
            .mt-grid > .oc-sdk-field,
            .mt-grid > .oc-sdk-select {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                column-gap: var(--mt-space-3);
                row-gap: var(--mt-space-1);
                align-items: start;
                padding: var(--mt-space-2) 0;
                border-top: 1px solid color-mix(in srgb, var(--mt-line) 45%, transparent);
            }

            /* A member this build declares no control for spans the row. */
            .mt-grid > .oc-sdk-text {
                padding: var(--mt-space-1) 0;
                font-size: 0.8125rem;
                color: var(--mt-dim);
                border-top: 1px solid color-mix(in srgb, var(--mt-line) 45%, transparent);
            }

            .mt-grid > :first-child {
                padding-top: 0;
                border-top: 0;
            }

            /*
             * A Settings member holds four to six characters — `1`, `3`,
             * `info`, `project-manager` — but the SDK gives its input and its
             * select trigger `width: 100%`, so inside the `1fr` value column
             * they filled roughly 850px each and the 18rem label above them
             * wrapped to two lines to keep up (2026-10-01 review). Capping
             * the *control* leaves the template, the header, and every pinned
             * label string exactly where they are.
             *
             * Both selectors name direct children of the row, so the select's
             * fixed-position option popup — which is not part of the grid —
             * never inherits the cap.
             */
            .mt-grid > .oc-sdk-field > input.oc-sdk-input,
            .mt-grid > .oc-sdk-select > .oc-sdk-trigger {
                max-width: 28ch;
            }

            /* ---------------------------------------------------------------- *
             * Chips: state as colour *and* label (005 FR-083).
             * ---------------------------------------------------------------- */

            .mt-chiprow {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--mt-space-2);
            }

            /* ---------------------------------------------------------------- *
             * Cards: one prerequisite / one run detail as a bordered unit.
             * ---------------------------------------------------------------- */

            .mt-card {
                display: flex;
                flex-direction: column;
                gap: var(--mt-space-1);
                padding: var(--mt-space-3);
                box-sizing: border-box;
                border: 1px solid color-mix(in srgb, var(--mt-line) 55%, transparent);
                border-radius: var(--mt-radius);
                background: var(--mt-sunken);
            }

            .mt-card-head {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: var(--mt-space-2);
            }

            .mt-card-title {
                margin: 0;
                font-family: var(--mt-font);
                font-size: 0.8125rem;
                font-weight: 650;
                line-height: 1.4;
                color: var(--mt-ink);
            }

            .mt-card-body {
                display: flex;
                flex-direction: column;
                gap: var(--mt-space-1);
                font-size: 0.8125rem;
                line-height: 1.5;
                color: var(--mt-dim);
            }

            .mt-fix {
                display: block;
                padding-left: var(--mt-space-2);
                border-left: 2px solid var(--mt-accent);
                color: var(--mt-ink);
            }

            /* Collapsible detail: hidden until the operator asks for it. */
            .mt-details {
                font-size: 0.8125rem;
                line-height: 1.5;
            }

            .mt-details > summary {
                cursor: pointer;
                color: var(--mt-dim);
                font-size: 0.75rem;
                padding: var(--mt-space-1) 0;
            }

            .mt-details > summary:hover {
                color: var(--mt-ink);
            }

            .mt-details > summary:focus-visible {
                outline: 2px solid var(--mt-accent);
                outline-offset: 2px;
                border-radius: 4px;
            }

            .mt-details[open] > summary {
                margin-bottom: var(--mt-space-1);
            }

            /* ---------------------------------------------------------------- *
             * Dense list surfaces: a header row above aligned columns.
             * ---------------------------------------------------------------- */

            .mt-head {
                display: grid;
                /* The SDK row's own gap, so a header cell sits over its column. */
                column-gap: var(--mt-space-2);
                padding: 0 var(--mt-space-2) var(--mt-space-1);
                font-size: 0.6875rem;
                font-weight: 700;
                letter-spacing: 0.07em;
                color: var(--mt-dim);
                border-bottom: 1px solid color-mix(in srgb, var(--mt-line) 60%, transparent);
            }

            /*
             * The Settings header, narrow: gone, because the stack it would
             * label has one column — three labels over it read as orphaned
             * words, not as a table's head (the 560px frame, 2026-10-01
             * review).
             *
             * Its *position* is the fix. `.mt-head` and `.mt-head--settings`
             * weigh the same (0,1,0), so the later declaration wins; back in
             * the Settings section this rule lost to `.mt-head`'s `display`
             * and never took effect. Declared after the base rule it now wins
             * by source order — no `!important` — and block 2's
             * `display: grid` at 900px is later still, so the header comes
             * back at the width that has three columns to hang it over.
             */
            .mt-head--settings {
                display: none;
            }

            /*
             * Dispatches, stacked (the default): the subject *is* the row, so
             * the header gives it a full-width line of its own and drops
             * Trigger / State / Age onto the second line — where
             * `.mt-list--dispatches` puts them when it restacks the row. All
             * four labels stay in the DOM; the grid areas choose only which
             * line each one stands on, so State's right edge still lands on
             * the badge's and Age's on the meta column's. Block 2 folds the
             * areas back into one line at 900px.
             */
            .mt-head--dispatches {
                grid-template-columns: 64px minmax(0, 1fr) max-content 4.5rem;
                grid-template-areas:
                    'subject subject subject subject'
                    'trigger . state age';
                row-gap: var(--mt-space-1);
            }

            .mt-head--dispatches > :nth-child(1) {
                grid-area: trigger;
            }

            .mt-head--dispatches > :nth-child(2) {
                grid-area: subject;
            }

            .mt-head--dispatches > :nth-child(3) {
                grid-area: state;
                text-align: right;
            }

            .mt-head--dispatches > :nth-child(4) {
                grid-area: age;
                text-align: right;
            }

            /* Bindings and Accounts: the same lead/subject arithmetic. */
            .mt-head--bindings,
            .mt-head--accounts {
                grid-template-columns: 64px minmax(0, 1fr) 4.5rem;
            }

            .mt-head--bindings > :last-child,
            .mt-head--accounts > :last-child {
                text-align: right;
            }

            /* The list the header labels, so its rows can be pinned to match. */
            .mt-list .oc-sdk-row-meta {
                flex: 0 0 4.5rem;
                text-align: right;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /*
             * The SDK's row subtitle is one `nowrap` line ending in an
             * ellipsis, so a dispatch reason lost its tail — `…the session
             * reported anoth…` — in a row that had a free line under it
             * (2026-10-01 review). Inside a `.mt-list` the subtitle wraps
             * instead: these lists are evidence the operator reads, and a cut
             * that happens to land mid-word tells them less than the second
             * line does. Nothing here moves a cell — it only lets a cell take
             * more than one line, so the header keeps lining up over its
             * columns.
             */
            .mt-list .oc-sdk-row-sub {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }

            /*
             * A dispatch row, stacked (the default): the subject — title,
             * then the diagnosis that explains it — takes the first line at
             * full width, and trigger, state, and age share the line under
             * it. Before this rule the subject sat *between* a 64px trigger,
             * a state chip, and the age column, so every title in the list
             * truncated to its first few words (`#117 Review: split the
             * polli…`) while the diagnosis below it had room to wrap — the
             * defect this wave exists to fix (product-owner order 2026-10-01).
             *
             * `order` moves the subject visually, never in the DOM: a screen
             * reader still meets trigger → subject → state → age, the row is
             * still one focus stop, and the header above lays its four labels
             * onto the same two lines. The badge rides `margin-left: auto` to
             * the age column's edge — the right edge the header's State cell
             * holds — because on the second line no `1fr` cell is left to
             * push it there. Block 2 folds the row back into columns at
             * 900px, where a subject line has the width to spare.
             */
            .mt-list--dispatches .oc-sdk-row {
                flex-wrap: wrap;
            }

            .mt-list--dispatches .oc-sdk-row-main {
                order: -1;
                flex: 1 0 100%;
            }

            .mt-list--dispatches .oc-sdk-badge {
                margin-left: auto;
            }

            /* ---------------------------------------------------------------- *
             * Shared text treatments.
             * ---------------------------------------------------------------- */

            .mt-mono {
                font-family: var(--mt-mono);
                font-size: 0.75rem;
            }

            .mt-muted {
                color: var(--mt-dim);
            }

            .mt-prose {
                font-size: 0.8125rem;
                line-height: 1.6;
                max-width: 72ch;
            }

            /*
             * The Accounts custody disclaimer is four long paragraphs
             * written as one `pre-line` paragraph; without a cap they run
             * the full panel width (~110 characters at the default capture
             * size) and read as a wall. `--mt-key-width`'s cousin: the cap
             * is a measure, not a truncation — the copy wraps, unchanged.
             */
            [data-accounts-disclaimer] p {
                max-width: 74ch;
            }

            /* ---------------------------------------------------------------- *
             * Field manual: the rail's visual language (005 FR-130).
             *
             * The panel is a document, not a dashboard: a technical field
             * manual rendered at rail width. Everything below is
             * **presentation** — no rule here changes a control, a label, a
             * state cue, or what the accessibility tree reports.
             *
             * Four devices carry it, each deliberately restrained because the
             * rail is narrow:
             *
             * 1. **A drafting grid** behind the whole pane, drawn once on the
             *    root's own background rather than on any content box. It sits
             *    under everything (`z-index: -1`), takes no pointer events, and
             *    carries no colour of its own — only a share of `--mt-line`.
             * 2. **Compact technical labels.** Block headings become monospace,
             *    uppercase and tracked out, which reads as a field label at
             *    10px in a way the host's own sans at that size does not.
             * 3. **A signal edge on the first block of a tab**, and on a card
             *    that carries its own emphasis. This is the *selective* part:
             *    most content stays open on the pane, so the rail is not a
             *    stack of identically weighted cards.
             * 4. **A corner tick** on every block — a static drafting mark
             *    drawn from the block's own accent, not a glyph, so it adds
             *    nothing to the accessibility tree and nothing an operator has
             *    to read.
             *
             * ## Why this block is last
             *
             * It is placed at the end of the sheet rather than beside the rules
             * it amends because several of them *are* amendments: `.mt-heading`
             * and `.mt-head` are declared above with the host's own type, and
             * a rule of equal specificity placed earlier loses to them on
             * source order alone. The first draft of this block sat next to the
             * rules it described and was silently overridden — the heading
             * labels rendered in the host's sans, at the host's size, and every
             * screenshot looked exactly as it had before this file changed.
             *
             * No device animates: there is no `transition`, no `animation`, and
             * no `@keyframes` anywhere in this file, and the field-manual
             * decoration must stay still (005 AC-160).
             * ---------------------------------------------------------------- */

            /*
             * The drafting grid. `position: fixed` with a `z-index` below the
             * content and `pointer-events: none`, so it never scrolls with the
             * content, never eats a click, and never sits between an operator
             * and a control. `background-image` rather than `background` is
             * deliberate: the rule paints no colour of its own, so the pane
             * behind it is still whatever the host chose.
             */
            #root {
                position: relative;
                isolation: isolate;
            }

            #root::before {
                position: fixed;
                z-index: -1;
                pointer-events: none;
                inset: 0;
                background-image:
                    linear-gradient(to right, var(--mt-faint) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--mt-faint) 1px, transparent 1px);
                background-size: 28px 28px;
                content: '';
            }

            /* A block: an open surface with a hairline and a corner tick. */
            .mt-block {
                position: relative;
            }

            /*
             * The corner tick: two borders of a 9px square clipped to a corner,
             * drawn in the block's own accent colour — no glyph, no text, and no
             * colour the host does not already own.
             */
            .mt-block::after {
                position: absolute;
                top: 0;
                right: 0;
                width: 9px;
                height: 9px;
                border-top: 1px solid var(--mt-accent);
                border-right: 1px solid var(--mt-accent);
                opacity: 0.5;
                content: '';
                pointer-events: none;
            }

            /* Compact technical labels: the block heading is a field label. */
            .mt-heading {
                font-family: var(--mt-mono);
                font-size: 0.625rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .mt-heading--title {
                font-family: var(--mt-font);
                font-size: 0.9375rem;
                letter-spacing: -0.01em;
                text-transform: none;
            }

            /*
             * Selective emphasis: the **first** block in each tab carries the
             * signal edge. `:first-of-type` rather than `:first-child`, so a
             * banner above it does not change which block is emphasised.
             */
            [data-body] > .mt-block:first-of-type {
                border-inline-start: 2px solid var(--mt-accent);
                padding-inline-start: calc(var(--mt-pad) - 2px);
            }

            /* A card is the second kind of emphasis, so it is marked as one. */
            .mt-card {
                border-inline-start: 2px solid color-mix(in srgb, var(--mt-accent) 55%, transparent);
            }

            /*
             * Dense lists get a technical header: a monospace label row over a
             * rule that reads as a table head. `.mt-head` is `display: grid` by
             * default and only becomes one at the wide breakpoints, so this
             * changes colour, family and tracking only — never which layout is
             * in force.
             */
            .mt-head {
                font-family: var(--mt-mono);
                letter-spacing: 0.09em;
                text-transform: uppercase;
            }

            /*
             * Chips carry the dispatch state. The border is what makes a chip
             * readable when the state colour sits close to the surface; the
             * label inside it is what makes the state legible at all (005
             * FR-083). Nothing here replaces either.
             */
            .oc-sdk-badge {
                font-family: var(--mt-mono);
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            /*
             * Definition rows read as a specification, so the key keeps its
             * monospace family and each row keeps a hairline. An interactive
             * row is marked at its left edge when it is hovered or holds focus,
             * which is a shape rather than a colour change alone.
             */
            .mt-def {
                border-top-color: var(--mt-faint);
            }

            .mt-def--interactive {
                border-inline-start: 2px solid transparent;
                padding-left: calc(var(--mt-space-2) - 2px);
            }

            .mt-def--interactive:hover,
            .mt-def--interactive:focus-within {
                border-inline-start-color: var(--mt-accent);
            }

            /*
             * Keyboard focus stays unmistakable. The disclosure summary keeps
             * its own outline, and every other focusable the panel draws gets
             * the same one, so focus is never carried by a colour change alone
             * (005 FR-082).
             */
            .mt-block :focus-visible,
            .mt-card :focus-visible,
            [data-body] > * :focus-visible {
                outline: 2px solid var(--mt-accent);
                outline-offset: 2px;
                border-radius: 3px;
            }

            /*
             * The Settings save bar wraps instead of overflowing.
             *
             * Measured at 320px, the narrowest frame the host gives an extension panel: the three
             * buttons plus the "No unsaved changes." line laid out on one 455px row inside a 290px
             * region, so the region scrolled sideways and `Restore defaults` sat 148px past the
             * frame's edge — a primary action a reader could not see without scrolling the panel
             * sideways. 005 FR-082 asks that no primary action require horizontal scrolling.
             *
             * The selector names the row by its shape rather than by a class the panel does not
             * control: a flex row holding three sibling buttons. The save bar is built in
             * `src/settings-mount.ts` with inline styles and this stylesheet is where presentation
             * lives, so a rule here is what can answer it without a source change — and it changes
             * nothing at any width where the row already fit.
             */
            .mt-block div:has(> button + button + button) {
                flex-wrap: wrap;
                row-gap: var(--mt-space-2);
            }

            /*
             * The six tabs fit at 320px, the narrowest frame the host gives an extension panel.
             *
             * Measured: the strip is a horizontal scroller whose six labels, laid out at the SDK's
             * 11.4px on 10px padding, take 413px of a 314px strip — so the last two tabs were only
             * reachable by scrolling the strip sideways, and they did not truncate on the way, since
             * the SDK leaves text-overflow at clip with no max-width. 005 FR-082 asks that no primary
             * action require horizontal scrolling and that tab labels truncate rather than wrap, so
             * the labels are given room instead of a scrollbar: below 380px the strip's type and
             * padding come down together and the six fit. Nothing above 380px moves, so the 560px and
             * 720px captures are unaffected.
             *
             * The selector is rooted at #root because it has to out-specify the SDK's own
             * `.oc-sdk-tab { padding: 0 10px; font-size: 0.8125rem }` — measured, not assumed: at
             * equal specificity the SDK's sheet wins on source order and the rule below changes
             * nothing at all.
             */
            @media (max-width: 380px) {
                #root .oc-sdk-tab {
                    padding-inline: 0.25rem;
                    font-size: 0.625rem;
                    letter-spacing: -0.01em;
                }
            }
        </style>

        <!--
            Block 2 — width regimes.

            Everything above *is* the rail layout: definition rows stacked,
            Settings one column with no header over it, a dispatch row whose
            subject owns its first line. These rules only ever add structure
            when the panel is wide enough to hold it, so a narrow viewport
            never has to fall out of a wide design — it gets the design that
            was drawn for it.

            Both thresholds come from the same evidence as the capture widths
            (see DEFAULT_WIDTH in `tools/visual/shot.js`): the host's default
            panel measures 500–715px and is resizable to 1400. 640 is where a
            key column beside its value still leaves the value the majority of
            the line; 900 is where `18rem | 1fr | 15rem` and a four-column
            dispatch row both fit without starving the middle column.
        -->
        <style>
            @media (min-width: 640px) {
                /* Definition rows gain their key column. The `:not` keeps a
                   note row — prose with nothing to label — spanning the
                   whole row, which is what it does at every width. */
                .mt-def:not(.mt-def--note) {
                    grid-template-columns: minmax(0, var(--mt-key-width)) minmax(0, 1fr);
                    column-gap: var(--mt-space-3);
                    row-gap: 0;
                }

                /* ...and the label stops reading like a stacked heading and
                   reads like a key again: the columnar type, with both
                   modifiers restored (the stacked rule out-specifies them). */
                .mt-def .mt-key {
                    font-size: 0.8125rem;
                    line-height: 1.45;
                    font-weight: 400;
                    letter-spacing: normal;
                }

                .mt-def .mt-key--strong {
                    font-weight: 600;
                }

                .mt-def .mt-key--mono {
                    font-size: 0.75rem;
                }
            }

            @media (min-width: 900px) {
                /* Settings: the three-column table and the header naming it. */
                .mt-head--settings {
                    display: grid;
                    column-gap: var(--mt-space-3);
                    padding: 0 0 var(--mt-space-1);
                    grid-template-columns: minmax(0, 18rem) minmax(0, 1fr) minmax(0, 15rem);
                }

                .mt-grid > .oc-sdk-field,
                .mt-grid > .oc-sdk-select {
                    grid-template-columns: minmax(0, 18rem) minmax(0, 1fr) minmax(0, 15rem);
                }

                /* Dispatches: the header's two lines fold into one, over the
                   four columns the areas already name. */
                .mt-head--dispatches {
                    grid-template-areas: 'trigger subject state age';
                    row-gap: 0;
                }

                /* ...and the row folds back beside its chips. */
                .mt-list--dispatches .oc-sdk-row {
                    flex-wrap: nowrap;
                }

                .mt-list--dispatches .oc-sdk-row-main {
                    order: 0;
                    flex: 1 1 auto;
                }

                .mt-list--dispatches .oc-sdk-badge {
                    margin-left: 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="panel-startup-notice" role="status" aria-live="polite" aria-atomic="true">
            Mecha Turk panel is starting. If this message remains, reopen the panel; if the problem persists, check OpenChamber's host logs.
        </div>
        <div id="root"></div>
        <script src="main.js"></script>
    </body>
</html>
