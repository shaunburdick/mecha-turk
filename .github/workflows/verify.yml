# The repository's own gate, as a check: `npm ci`, then `npm run verify`
# (build -> lint -> typecheck -> test; see package.json "scripts" and the
# Commands section of AGENTS.md). One job, one step sequence — this is a
# gate, not a pipeline. Action versions are pinned to commit SHAs; the
# `# vX.Y.Z` comment keeps them readable.
name: CI

# Both triggers answer to the default branch: `pull_request` checks a PR
# into it, `push` checks the branch itself. Feature branches are not named
# — a PR carries its own checks, and the branch is deleted when its PR is
# squash-merged.
on:
  pull_request:
  push:
    branches:
      - main

# Read-only by design: this workflow never pushes, comments, or uploads,
# so it gets nothing but the ability to read the repository.
permissions:
  contents: read

jobs:
  verify:
    # The Node version is in the job name so a red leg identifies the release
    # that failed from the checks list and the run list, without opening the
    # log. `run-name` would put it on the run, but that expression has no
    # access to `matrix` — only job names do.
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One red leg must not cancel the other: a break at the floor and a
      # break at the newest patch are different bugs and both are reported.
      fail-fast: false
      matrix:
        node: ['24.15.0', '24']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job talks to git over the network, so the token
          # is never written into the workspace's git configuration.
          persist-credentials: false

      # package.json engines.node is ">=24.15.0" — a floor, not a chosen
      # release. Two legs, and the floor is the reason there are two: 24.15.0
      # is the lowest release every `engines.node` range in package-lock.json
      # admits (vitest, eslint-plugin-jsdoc and eslint each name it), so it is
      # the lower edge of what this tree installs on at all. A leg pinned to
      # the newest 24.x never runs it, and a floor that has drifted above a
      # break stays invisible until someone's own machine hits it — which is
      # how the stale `>=20.19.0` floor survived here. The second leg is '24',
      # which setup-node resolves to the newest 24.x patch, covering the open
      # end of the range too. tests/manifest.test.ts re-checks the same subset
      # offline, so the floor cannot drift again without the gate going red.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # One line: cache npm's download cache keyed on package-lock.json,
          # so `npm ci` re-downloads nothing on a warm run.
          cache: npm

      # `npm run build` shells out to `bunx openchamber-guest-bundle`, which
      # runs @openchamber/sdk's TypeScript entry (scripts/bundle-guest.ts)
      # out of node_modules/.bin — without bun the first step of
      # `npm run verify` fails, so bun is a hard requirement of the gate.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version is pinned in the repository, not in this workflow:
          # `.bun-version` at the repo root holds `1.3.14`, the release
          # `npm run verify` is green on, and this input reads that file
          # (setup-bun's documented `bun-version-file` input).
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: npm ci

      - name: Run the repository gate
        # No `env` here on purpose: the heap floor for the type-aware lint lives
        # in `package.json`'s `lint` script, so a local `npm run verify` and this
        # job get the same one. `eslint .` needs between 1.5 and 2 GB of old
        # space for a tree this size — measured, not guessed: the run aborts with
        # an OOM at `--max-old-space-size=1536` and passes at 2048, and `main` has
        # the same profile as any branch, so it is a property of the repository's
        # size rather than of one change. Node's default ceiling lands just under
        # the requirement on a hosted runner, which is what made this gate fail
        # intermittently before the floor was stated anywhere.
        run: npm run verify

      # AGENTS.md invariant 1, enforced by CI instead of by review: OpenChamber
      # never compiles TypeScript, so `panel/main.js` and `service/main.js`
      # ship exactly as committed and must match their sources byte-for-byte.
      # The step above rebuilds both of them; if the rebuild leaves a tracked
      # file dirty, the commit forgot the bundle its source requires (or the
      # bundle drifted from the source it claims to come from). Non-zero exit
      # fails the gate — and this workflow only reads, so nothing is pushed.
      - name: Assert the committed bundles match their sources
        run: git diff --exit-code
