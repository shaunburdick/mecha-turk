# Publish the release the pushed tag names.
#
# The tag is cut by hand — `git tag v0.1.0 && git push origin v0.1.0` after the
# version bump of AGENTS.md invariant 2 — and this workflow is what the push
# earns: it refuses a tag the manifest disagrees with, requires the CI run the
# tagged commit already has to have passed, and publishes the GitHub Release
# from that tag with generated notes.
#
# Why link rather than re-run: a commit is content-addressed, so the `npm run
# verify` that passed on `<sha>` is a statement about *these bytes* — running it
# again against the same SHA cannot learn anything the first run did not, and a
# second copy of the gate in a second file is a second place for the two to
# drift apart. What is kept is the posture: a tag whose SHA has no successful
# CI run is refused, and the committed-bundle assertion `verify.yml` makes
# after its rebuild travels with that result.
#
# A tag push starts this file and nothing else: `verify.yml` and `site.yml` are
# filtered to `branches: main`, so neither answers a tag.
#
# It never pushes a ref. `contents: write` is granted to one job so the release
# action can create the Release object, and nothing below can move a branch or a
# tag. The gate job asks only to read the Actions runs it is checking. That
# action is the workflow's only third-party code, SHA-pinned with its version
# in a comment — the convention `verify.yml` and `site.yml` both hold to, and
# the supply-chain posture a pinned ref buys.
name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only at the workflow level, which is what the gate job inherits the shape
# of. Both jobs state their own grant instead: a job-level `permissions` block
# replaces this set rather than adding to it.
permissions:
  contents: read

jobs:
  gate:
    # No `npm ci`, no second `npm run verify`: this job reads the result the
    # commit already has. It is the only job that decides whether a release may
    # exist, and it holds a read-only token while it decides.
    name: the tagged commit already passed CI
    runs-on: ubuntu-latest
    # Above the 900 s it may spend waiting: the refusal message must be the
    # thing that ends the run, not the job timeout cutting it off first.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the repository at the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to git over the network, so the token is never
          # written into the workspace's git configuration. Matches `verify.yml`.
          persist-credentials: false

      # Fail closed, and first: a tag is a claim about the manifest, and the
      # manifest is what OpenChamber reads for its git-URL update notifications
      # (invariant 2). A tag of `v0.2.0` over a `0.1.0` manifest would publish a
      # release the extension never reports, so the run stops here before it
      # waits for anything.
      - name: Refuse a tag that does not name the shipped version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Tag does not match the manifest::${GITHUB_REF_NAME} names a version the manifest does not ship (v${version})"
            exit 1
          fi

      # The link itself: find the CI workflow's runs for this SHA and take the
      # answer from them. An unfinished run is waited for, never assumed — a tag
      # pushed seconds after the merge can arrive before CI has started, and a
      # green run that has already finished must not stand in for one still
      # going — and a completed run that was not a success, or nothing finished
      # by the deadline, refuses the release rather than publishing past the gate.
      - name: Require the CI run this commit already has to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 900))
          while :; do
            runs="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow verify.yml \
              --commit "${GITHUB_SHA}" \
              --json status,conclusion \
              --limit 20)"
            total="$(jq 'length' <<<"${runs}")"
            finished="$(jq '[.[] | select(.status == "completed")] | length' <<<"${runs}")"

            if [ "${total}" -gt 0 ] && [ "${finished}" -eq "${total}" ]; then
              not_passed="$(jq '[.[] | select(.conclusion != "success")] | length' <<<"${runs}")"
              if [ "${not_passed}" -gt 0 ]; then
                echo "::error title=CI did not pass on ${GITHUB_REF_NAME}::${GITHUB_SHA} has a CI run that completed without success; a release is published from a commit that passed the gate, not from one that did not."
                exit 1
              fi
              echo "CI passed on ${GITHUB_SHA} (${total} run(s)); the release publishes from that result."
              exit 0
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error title=No finished CI run for ${GITHUB_REF_NAME}::No CI run has finished for ${GITHUB_SHA}. Tag a commit the gate has run against, or let CI finish first."
              exit 1
            fi

            sleep 10
          done

  publish:
    needs: gate
    name: publish the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release from the tag
        # SHA-pinned with the version in a comment — the convention the other two
        # workflows hold to, and the one `tests/manifest.test.ts` checks here too.
        # v3 is the Node 24 line; v2 ended at 2.6.2 on the deprecated Node 20
        # runtime.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # The tag names the release, so the title is the tag rather than a
          # sentence someone has to remember to write.
          name: ${{ github.ref_name }}
          # Notes from the commits since the previous release; with no previous
          # tag — the case this repository is in — from the whole history, which
          # is what a first release should say. The token is the job's own
          # `github.token`, which is the action's default, so it is not restated.
          generate_release_notes: true
