# Publish the release the pushed tag names.
#
# The tag is cut by hand — `git tag v0.1.0 && git push origin v0.1.0` after the
# version bump of AGENTS.md invariant 2 — and this workflow is what the push
# earns: the repository gate runs again against the exact commit being released,
# a tag the manifest disagrees with is refused before anything is published, and
# the GitHub Release is created from the tag with generated notes.
#
# A tag push starts this file and nothing else: `verify.yml` and `site.yml` are
# filtered to `branches: main`, so neither answers a tag.
#
# It never pushes a ref. `contents: write` is granted to one job so `gh release`
# can create the Release object, and nothing below can move a branch or a tag.
# Action versions are pinned to commit SHAs; the `# vX.Y.Z` comment keeps them
# readable — the convention `verify.yml` and `site.yml` both hold to.
name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only at the workflow level, which is the gate job's whole grant. The
# publish job asks for the one scope it needs by name, and a job-level
# `permissions` block replaces this set rather than adding to it.
permissions:
  contents: read

jobs:
  verify:
    # The gate runs first, alone, on a token that can only read. A release is the
    # one moment a red suite has to stop something being published, and a job
    # holding write would be running the check that decides whether it may.
    name: verify (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository at the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to git over the network, so the token is never
          # written into the workspace's git configuration. Matches `verify.yml`.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The newest 24.x — the leg `verify.yml` runs on every push to `main`.
          # One leg rather than the floor-and-newest pair, because this is a
          # re-run of a gate that has already passed on this commit, not the
          # first place it runs.
          node-version: '24'
          # Keyed on the root lockfile, which this job installs from.
          cache: npm

      # `npm run build` shells out to `bunx openchamber-guest-bundle`, so bun is
      # a hard requirement of the gate here exactly as it is in `verify.yml`.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: npm ci

      - name: Run the repository gate
        run: npm run verify

      # AGENTS.md invariant 1: the rebuild above must leave no tracked file
      # dirty, so the bundles are the ones this commit shipped.
      - name: Assert the committed bundles match their sources
        run: git diff --exit-code

      # Fail closed: a tag is a claim about the manifest, and the manifest is
      # what OpenChamber reads for its git-URL update notifications (invariant
      # 2). A tag of `v0.2.0` over a `0.1.0` manifest would publish a release
      # the extension never reports, so the run stops here rather than after.
      - name: Refuse a tag that does not name the shipped version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Tag does not match the manifest::${GITHUB_REF_NAME} names a version the manifest does not ship (v${version})"
            exit 1
          fi

  publish:
    needs: verify
    name: publish the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        # `--verify-tag` re-checks that the tag exists on the remote rather than
        # trusting the trigger; `--generate-notes` writes the body from the
        # commits since the previous release, which for a first release is the
        # whole history — what a first release should say. No checkout of history
        # is needed for either: `gh` reads them from the API.
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes
